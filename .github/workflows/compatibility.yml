name: Compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.6.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Explicit stdio MCP smoke: validates the CLI subprocess MCP transport
      # works in a clean project.  Runs the real stdio subprocess test from
      # the compatibility suite.
      - name: Stdio MCP smoke
        run: node --test "tests/compatibility/mcp.test.ts"
