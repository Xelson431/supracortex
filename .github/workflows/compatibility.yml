name: Compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # pnpm 11.9 (installed via pnpm/action-setup) requires Node >= 22.13,
        # so CI exercises that toolchain minimum. The package `engines` floor
        # stays at >= 22.6 because the runtime still supports it.
        node: ['22.13.0']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Explicit stdio MCP smoke: validates the CLI subprocess MCP transport
      # works in a clean project.  Runs the real stdio subprocess test from
      # the compatibility suite.
      - name: Stdio MCP smoke
        run: node --import ./tests/isolate-config.ts --test "tests/compatibility/mcp.test.ts"
